<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mei's Bakery</title>

    <link rel="stylesheet" href="css/styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">

    <div class="carrito">
        🛒
        <span id="contador">0</span>
    </div>

</header>

<div id="panelCarrito" class="panelCarrito">

    <div class="panelHeader">

        <h2>🛒 Mi Pedido</h2>

        <button id="cerrarCarrito">✕</button>

    </div>

    <div id="listaCarrito"></div>

    <div class="panelFooter">

        <h3>Total:
            <span id="total">$0.00</span>
        </h3>

        <button id="btnFinalizar">
        Finalizar pedido
        </button>

    </div>

<div id="formularioCliente" class="formulario oculto">

    <input
        type="text"
        id="nombreCliente"
        placeholder="Nombre">

    <input
        type="text"
        id="telefonoCliente"
        placeholder="Teléfono">

    <input
        type="text"
        id="direccionCliente"
        placeholder="Dirección">

    <button id="enviarWhatsapp">
        Enviar por WhatsApp
    </button>

</div>

</div>

<div class="container">

 <section class="hero">

    <img src="assets/logo.png" class="logoHero">

    <h1>Mei's Bakery</h1>

    <p>
        Galletas artesanales hechas con ingredientes de calidad y mucho amor.
    </p>

</section>

    <section id="catalogo" class="catalogo"></section>

    <section class="beneficios">

        <div class="card">
            🍪
            <h3>Artesanales</h3>
            <p>Preparadas diariamente.</p>
        </div>

        <div class="card">
            🚚
            <h3>Entrega</h3>
            <p>Envíos a domicilio.</p>
        </div>

        <div class="card">
            🎂
            <h3>Personalizadas</h3>
            <p>Para cualquier ocasión.</p>
        </div>

    </section>

</div>

<script src="js/productos.js"></script>
<script src="js/carrito.js"></script>
<script src="js/app.js"></script>

<div id="toast" class="toast">
    Producto agregado al carrito
</div>

</body>
</html>
